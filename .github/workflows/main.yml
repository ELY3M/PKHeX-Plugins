name: Elys Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
       dotnet-version: '10.0.x'
          
    - name: Get Pkhex  
      run: git clone -q --depth=5 --branch=master https://github.com/kwsch/PKHeX.git ${{ github.workspace }}/PKHeX

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet restore ${{ github.workspace }}\PKHeX\PKHeX.slnx
      
    - name: Build Pkhex
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet build ${{ github.workspace }}\PKHeX\PKHeX.slnx --configuration Release
                          
    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet restore .
       
##xmllint --xpath '//Version/text()' Directory.Build.props >> version
    - name: Get pkhex.core version
      run: |
          dir C:\Users\runneradmin\.nuget\packages\pkhex.core\
          dir -n C:\Users\runneradmin\.nuget\packages\pkhex.core\ >> version          
          $VERSIONNAME=$(cat version)
          echo "VERSIONNAME=$VERSIONNAME" >> $env:GITHUB_ENV
          echo VERSIONNAME is: $VERSIONNAME
          dir C:\Users\runneradmin\.nuget\packages\pkhex.core\$VERSIONNAME\lib
          
    - name: copy latest dll to nuget pkhex.core dir
      run: | 
        echo "pkhex version: ${{ env.VERSIONNAME }}" 
        XCOPY ${{ github.workspace }}\PKHeX\PKHeX.Core\bin\Release\net10.0\PKHeX.Core.dll C:\Users\runneradmin\.nuget\packages\pkhex.core\${{ env.VERSIONNAME }}\lib\net10.0\ /Y 
        dir C:\Users\runneradmin\.nuget\packages\pkhex.core\${{ env.VERSIONNAME }}\lib\net10.0\
      
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet build . --configuration Release
            
    - name: Create Release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ github.token }} 
      with:
        draft: false
        prerelease: false
        release_name: ${{ steps.version.outputs.version }}
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
            
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: ${{ github.workspace }}\AutoLegalityMod\bin\Release\net10.0-windows\AutoModPlugins.dll
      env:
        GITHUB_TOKEN: ${{ github.token }} 
        
