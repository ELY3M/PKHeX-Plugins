name: Build

on:
  push:
    branches: [ "cherrytree" ]
  pull_request:
    branches: [ "cherrytree" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions: write-all

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
       dotnet-version: '10.0.x'
      
    - name: Setup Nuget
      uses: nuget/setup-nuget@v2
        
    #- name: Add MSBuild to PATH
    #  uses: microsoft/setup-msbuild@v2

    
    - name: Get Pkhex  
      run: git clone -q --depth=5 --branch=master https://github.com/kwsch/PKHeX.git ${{ github.workspace }}/PKHeX

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{ github.workspace }}\PKHeX\PKHeX.sln
      
    - name: Build Pkhex
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      ##run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{ github.workspace }}\PKHeX\PKHeX.sln
      run: dotnet build ${{ github.workspace }}\PKHeX\PKHeX.sln

    - name: Show Github infos
      run: | 
        echo 'Workspace path ${{ github.workspace }} - runner.temp ${{ runner.temp }}'  
                          
    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: | 
          nuget restore ${{env.SOLUTION_FILE_PATH}}
          
##xmllint --xpath '//Version/text()' Directory.Build.props >> version
    - name: Get pkhex.core version
      run: |
          dir C:\Users\runneradmin\.nuget\packages\pkhex.core\
          dir -n C:\Users\runneradmin\.nuget\packages\pkhex.core\ >> version          
          $VERSIONNAME=$(cat version)
          echo "VERSIONNAME=$VERSIONNAME" >> $env:GITHUB_ENV
          echo VERSIONNAME is: $VERSIONNAME
          dir C:\Users\runneradmin\.nuget\packages\pkhex.core\$VERSIONNAME\lib
          
    - name: copy latest dll to nuget pkhex.core dir
      run: | 
        echo "pkhex version: ${{ env.VERSIONNAME }}" 
        XCOPY ${{ github.workspace }}\PKHeX\PKHeX.Core\bin\Release\net10.0\PKHeX.Core.dll C:\Users\runneradmin\.nuget\packages\pkhex.core\${{ env.VERSIONNAME }}\lib\net10.0\ /Y 
        dir C:\Users\runneradmin\.nuget\packages\pkhex.core\${{ env.VERSIONNAME }}\lib\net10.0\
      
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      ##run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /t:Publish
      run: dotnet build ${{env.SOLUTION_FILE_PATH}}
            
    - name: Create Release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ github.token }} 
      with:
        draft: false
        prerelease: false
        release_name: ${{ steps.version.outputs.version }}
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
            
    - name: Upload Release
      uses: softprops/action-gh-release@v2.2.1
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: ${{ github.workspace }}\AutoLegalityMod\bin\Release\net10.0-windows\AutoModPlugins.dll
      env:
        GITHUB_TOKEN: ${{ github.token }} 
        
